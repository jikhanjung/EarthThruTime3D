server {
    listen 80;
    listen [::]:80;
    server_name earththrutime.nopeoplestime.info;
    location ^~ /.well-known/acme-challenge/ {
        root /srv/earththrutime3d/acme;
    }
    location / {
        return 301 https://earththrutime.nopeoplestime.info$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name earththrutime.nopeoplestime.info;
    ssl_certificate /etc/letsencrypt/live/earththrutime.nopeoplestime.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/earththrutime.nopeoplestime.info/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    charset utf-8;
    error_page 502 503 504 =503 /maintenance.html;
    location = /maintenance.html {
        root /srv/earththrutime3d;
        internal;
        add_header Retry-After 10 always;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    gzip on;
    gzip_types application/json application/javascript text/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_intercept_errors on;
        proxy_pass http://127.0.0.1:8014;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
