{% load static %}
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}지구의 시간을 탐색하다{% endblock %} · {{ app_name }}</title>
  <meta name="description" content="지질시대별 고지리를 3차원 지구로 재구성하는 연구 프로젝트">
  <meta property="og:title" content="{{ app_name }} · {{ vendor }}">
  <meta property="og:description" content="지질시대별 고지리를 3차원 지구로 재구성하는 연구 프로젝트">
  <meta name="theme-color" content="#112d35">
  <link rel="icon" href="{% static 'core/favicon.svg' %}" type="image/svg+xml">
  <link rel="stylesheet" href="{% static 'core/site.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <a class="skip" href="#main">본문으로 이동</a>
  <header><a class="brand" href="{% url 'home' %}">{{ app_name }}</a><nav aria-label="주 메뉴"><a href="{% url 'about' %}">프로젝트 소개</a></nav></header>
  <main id="main">{% block content %}{% endblock %}</main>
  {% include 'includes/footer.html' %}
  {% block scripts %}{% endblock %}
</body>
</html>
